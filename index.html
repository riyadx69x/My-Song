<script>
const PASSWORD = "Free";

// Login Function
function login(){
  let pass = document.getElementById("pass").value;

  if(pass === PASSWORD){
    document.getElementById("msg").style.color = "#00ff00";
    document.getElementById("msg").innerHTML = "Password correct";

    setTimeout(function(){
      document.getElementById("login-page").style.display = "none";
      document.getElementById("dashboard-page").style.display = "block";
      startMatrixAnimation();
    }, 800);

  } else {
    document.getElementById("msg").style.color = "#ff0000";
    document.getElementById("msg").innerHTML = "❌ Incorrect Password";
  }
}

// Enter Key Support
document.getElementById("pass").addEventListener("keypress", function(e){
  if(e.key === "Enter"){
    login();
  }
});

// Logout / Back Function
function logout(){
  document.getElementById("dashboard-page").style.display = "none";
  document.getElementById("login-page").style.display = "flex";
  document.getElementById("pass").value = "";
  document.getElementById("msg").innerHTML = "";
  
  // Pause Audio & Video
  const player = document.getElementById("audio-player");
  player.pause();
  
  const videoScreen = document.getElementById("video-screen");
  videoScreen.pause();
  videoScreen.style.display = "none";
}

// Music Player Function (With Video & White Button Toggle)
function playSong(title, audioSrc, videoSrc, btnElement){
  const player = document.getElementById("audio-player");
  const titleDisplay = document.getElementById("current-song-title");
  const videoScreen = document.getElementById("video-screen");

  // ১. প্লেয়ারে গান লোড ও প্লে
  player.src = audioSrc;
  player.play();
  titleDisplay.innerHTML = "▶ Playing: " + title;

  // ২. বাটনের কালার সাদা করা (Active state)
  const allBtns = document.querySelectorAll('.song-btn');
  allBtns.forEach(btn => btn.classList.remove('active'));
  btnElement.classList.add('active');

  // ৩. ভিডিও লোড এবং হ্যান্ডেল করা
  if(videoSrc && videoSrc.trim() !== ""){
    videoScreen.src = videoSrc;
    videoScreen.style.display = "block";
    videoScreen.play();
  } else {
    videoScreen.pause();
    videoScreen.style.display = "none";
  }
}

// ================= MATRIX GREEN ANIMATION =================
function startMatrixAnimation(){
  const canvas = document.getElementById('matrix-canvas');
  const ctx = canvas.getContext('2d');

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()*&^%';
  const fontSize = 14;
  const columns = canvas.width / fontSize;
  const drops = [];

  for (let i = 0; i < columns; i++) {
    drops[i] = 1;
  }

  function draw() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#00ff00';
    ctx.font = fontSize + 'px monospace';

    for (let i = 0; i < drops.length; i++) {
      const text = characters.charAt(Math.floor(Math.random() * characters.length));
      ctx.fillText(text, i * fontSize, drops[i] * fontSize);

      if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
        drops[i] = 0;
      }
      drops[i]++;
    }
  }

  setInterval(draw, 33);
}

// Handle window resize for canvas
window.addEventListener('resize', () => {
  const canvas = document.getElementById('matrix-canvas');
  if(canvas) {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
});
</script>
