@keyframes hackerGlitch {

  25% { transform: translate(-3px, 2px); box-shadow: -2px 0 15px #ff0000; }
  50% { transform: translate(3px, -2px); box-shadow: 2px 0 15px #00ffff; }
  75% { transform: translate(-2px, -1px); filter: hue-rotate(90deg); }
  100% { transform: translate(2px, 2px); box-shadow: 0 0 12px #00ff00; }

<script>
const PASSWORD = "Free";

// Login Function
function login(){
  let pass = document.getElementById("pass").value;

  if(pass === PASSWORD){
    document.getElementById("msg").style.color = "#00ff00";
    document.getElementById("msg").innerHTML = "Password correct";

    setTimeout(function(){
      document.getElementById("login-page").style.display = "none";
      document.getElementById("dashboard-page").style.display = "block";
      startMatrixAnimation();
    }, 800);

  } else {
    document.getElementById("msg").style.color = "#ff0000";
    document.getElementById("msg").innerHTML = "❌ Incorrect Password";
  }
}

// Enter Key Support
document.getElementById("pass").addEventListener("keypress", function(e){
  if(e.key === "Enter"){
    login();
  }
});

// Music Player Function
function playSong(title, audioSrc, videoSrc, btnElement){
  const player = document.getElementById("audio-player");
  const titleDisplay = document.getElementById("current-song-title");
  const videoScreen = document.getElementById("video-screen");
  const hackerImg = document.getElementById("hacker-img");

  // ১. গান প্লে করা
  player.src = audioSrc;
  player.play();
  titleDisplay.innerHTML = "▶ Playing: " + title;

  // ২. বাটনের কালার সাদা করা (Active state)
  const allBtns = document.querySelectorAll('.song-btn');
  allBtns.forEach(btn => btn.classList.remove('active'));
  btnElement.classList.add('active');

  // ৩. ছবিতে Glitch Effect শুরু করা
  hackerImg.classList.add('glitching');

  // ৪. ভিডিও লোড ও হ্যান্ডেল করা
  if(videoSrc && videoSrc.trim() !== ""){
    videoScreen.src = videoSrc;
    videoScreen.style.display = "block";
    videoScreen.currentTime = 0;
    videoScreen.play();
  } else {
    videoScreen.pause();
    videoScreen.style.display = "none";
    videoScreen.src = "";
  }
}

// 🎵 গান শেষ হলে সব রিমুভ করার লজিক 🎵
document.getElementById("audio-player").addEventListener("ended", function() {
  stopEffects();
});

document.getElementById("audio-player").addEventListener("pause", function() {
  if (this.ended || this.paused) {
    document.getElementById("hacker-img").classList.remove('glitching');
  }
});

document.getElementById("audio-player").addEventListener("play", function() {
  document.getElementById("hacker-img").classList.add('glitching');
});

function stopEffects(){
  const videoScreen = document.getElementById("video-screen");
  const titleDisplay = document.getElementById("current-song-title");
  const hackerImg = document.getElementById("hacker-img");

  hackerImg.classList.remove('glitching');

  videoScreen.pause();
  videoScreen.style.display = "none";
  videoScreen.src = "";

  const allBtns = document.querySelectorAll('.song-btn');
  allBtns.forEach(btn => btn.classList.remove('active'));

  titleDisplay.innerHTML = "Select a song to play...";
}

// ================= MATRIX GREEN ANIMATION =================
function startMatrixAnimation(){
  const canvas = document.getElementById('matrix-canvas');
  const ctx = canvas.getContext('2d');

  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;

  const characters = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789@#$%^&*()*&^%';
  const fontSize = 14;
  const columns = canvas.width / fontSize;
  const drops = [];

  for (let i = 0; i < columns; i++) {
    drops[i] = 1;
  }

  function draw() {
    ctx.fillStyle = 'rgba(0, 0, 0, 0.05)';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = '#00ff00';
    ctx.font = fontSize + 'px monospace';

    for (let i = 0; i < drops.length; i++) {
      const text = characters.charAt(Math.floor(Math.random() * characters.length));
      ctx.fillText(text, i * fontSize, drops[i] * fontSize);

      if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
        drops[i] = 0;
      }
      drops[i]++;
    }
  }

  setInterval(draw, 33);
}

// Handle window resize for canvas
window.addEventListener('resize', () => {
  const canvas = document.getElementById('matrix-canvas');
  if(canvas) {
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
  }
});
</script>
